name: Validate workflow structure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate structure (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\validate-workflow.ps1

      - name: Run negative fixtures (Windows PowerShell 5.1)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: .\tools\test-validation.ps1

      - name: Validate structure (Ubuntu PowerShell 7)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tools/validate-workflow.ps1

      - name: Run negative fixtures (Ubuntu PowerShell 7)
        if: always() && runner.os == 'Linux'
        shell: pwsh
        run: ./tools/test-validation.ps1
